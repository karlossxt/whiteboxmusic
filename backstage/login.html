<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Backstage Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <img src="../logo.png" alt="WhiteBox Music" onerror="this.style.display='none'">
            </div>
            <h1 class="login-title">Backstage Studio</h1>
            <p class="login-subtitle">Inicia sesión para continuar</p>

            <form id="loginForm" novalidate>
                <div class="login-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="admin@whitebox.music" autocomplete="email">
                </div>
                <div class="login-field">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <div class="login-error" id="loginError" style="display:none;"></div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="login-btn-text">Entrar</span>
                    <span class="login-btn-spinner" style="display:none;">
                        <span class="login-spinner-ring"></span>
                    </span>
                </button>
                <p class="login-forgot">
                    <button type="button" class="login-forgot-btn" id="forgotBtn">¿Olvidaste tu contraseña?</button>
                </p>
            </form>

            <div class="login-recover" id="recoverPanel" style="display:none;">
                <h2 class="login-recover-title">Recuperar contraseña</h2>
                <p class="login-recover-text">Te enviaremos un enlace para restablecer tu contraseña.</p>
                <div class="login-field">
                    <label for="recoverEmail">Email</label>
                    <input type="email" id="recoverEmail" placeholder="admin@whitebox.music" autocomplete="email">
                </div>
                <div class="login-error" id="recoverError" style="display:none;"></div>
                <div class="login-success" id="recoverSuccess" style="display:none;"></div>
                <button type="button" class="login-btn" id="recoverBtn">Enviar enlace</button>
                <p class="login-back">
                    <button type="button" class="login-forgot-btn" id="backBtn">← Volver al inicio de sesión</button>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="auth/admin-config.js"></script>
    <script>
    (function() {
        var form = document.getElementById('loginForm');
        var emailInput = document.getElementById('loginEmail');
        var passwordInput = document.getElementById('loginPassword');
        var errorEl = document.getElementById('loginError');
        var btnText = document.querySelector('.login-btn-text');
        var btnSpinner = document.querySelector('.login-btn-spinner');
        var loginBtn = document.getElementById('loginBtn');

        var supa = window.getSupabaseClient();

        var AUTHORIZED_UIDS = (window.Backstage && window.Backstage.ADMIN_UIDS) || ['91f304f5-f666-4a29-ad38-3b99c68829d4', 'd2dde41e-f1b5-4d7a-80a9-578e04871521'];

        function isAuthorizedUser(user) {
            if (!user || !user.id) return false;
            return AUTHORIZED_UIDS.indexOf(user.id) !== -1;
        }

        function setLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = '';
            } else {
                loginBtn.disabled = false;
                btnText.style.display = '';
                btnSpinner.style.display = 'none';
            }
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        var forgotBtn = document.getElementById('forgotBtn');
        var backBtn = document.getElementById('backBtn');
        var recoverPanel = document.getElementById('recoverPanel');
        var recoverEmail = document.getElementById('recoverEmail');
        var recoverError = document.getElementById('recoverError');
        var recoverSuccess = document.getElementById('recoverSuccess');
        var recoverBtn = document.getElementById('recoverBtn');

        function showRecoverError(msg) {
            recoverError.textContent = msg;
            recoverError.style.display = 'block';
        }

        forgotBtn.addEventListener('click', function() {
            form.style.display = 'none';
            recoverError.style.display = 'none';
            recoverSuccess.style.display = 'none';
            recoverPanel.style.display = 'block';
        });

        backBtn.addEventListener('click', function() {
            recoverPanel.style.display = 'none';
            form.style.display = '';
        });

        recoverBtn.addEventListener('click', function() {
            var email = (recoverEmail.value || '').trim();
            recoverError.style.display = 'none';
            recoverSuccess.style.display = 'none';

            if (!email) {
                showRecoverError('Ingresa tu email.');
                return;
            }

            recoverBtn.disabled = true;

            supa.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://whiteboxmusic.com.mx/backstage/reset-password.html'
            }).then(function(resp) {
                if (resp.error) {
                    showRecoverError('No fue posible enviar el enlace: ' + resp.error.message);
                    recoverBtn.disabled = false;
                    return;
                }
                recoverSuccess.textContent = 'Si el email existe, recibirás un enlace para restablecer tu contraseña.';
                recoverSuccess.style.display = 'block';
                recoverBtn.disabled = false;
                recoverEmail.value = '';
            });
        });

        // Si ya hay sesión activa, ir directo
        supa.auth.getSession().then(function(resp) {
            var user = resp && resp.data && resp.data.session ? resp.data.session.user : null;
            if (user) {
                if (isAuthorizedUser(user)) {
                    window.location.href = 'index.html';
                } else {
                    supa.auth.signOut();
                    showError('Acceso no autorizado.');
                }
            }
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            var email = (emailInput.value || '').trim();
            var password = passwordInput.value;

            if (!email || !password) {
                showError('Completa todos los campos.');
                return;
            }

            setLoading(true);

            supa.auth.signInWithPassword({ email: email, password: password })
                .then(function(resp) {
                    if (resp.error) {
                        setLoading(false);
                        var msg = (resp.error && resp.error.message) || '';
                        if (/invalid login credentials/i.test(msg)) {
                            showError('Email o contraseña incorrectos.');
                        } else if (/email not confirmed/i.test(msg)) {
                            showError('Tu email aún no está confirmado. Revisa tu correo.');
                        } else if (/rate|limit/i.test(msg)) {
                            showError('Demasiados intentos. Espera un momento.');
                        } else {
                            showError('Error al iniciar sesión: ' + msg);
                        }
                        return;
                    }
                    var user = resp.data && resp.data.user;
                    if (!user) {
                        setLoading(false);
                        showError('No se pudo iniciar sesión.');
                        return;
                    }
                    if (!isAuthorizedUser(user)) {
                        supa.auth.signOut();
                        showError('Acceso no autorizado.');
                        setLoading(false);
                        return;
                    }
                    window.location.href = 'index.html';
                })
                .catch(function(err) {
                    setLoading(false);
                    var msg = (err && err.message) || '';
                    if (/invalid login credentials|invalid-api-key/i.test(msg)) {
                        showError('Email o contraseña incorrectos.');
                    } else if (/rate|limit/i.test(msg)) {
                        showError('Demasiados intentos. Espera un momento.');
                    } else {
                        showError('Error al iniciar sesión. Intenta de nuevo.');
                    }
                });
        });
    })();
    </script>
</body>
</html>
