<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESCUBRE | WhiteBox Music</title>
    <meta name="description" content="Descubre nuevos artistas independientes. Explora por género, ciudad o estilo musical.">
    <meta property="og:title" content="DESCUBRE | WhiteBox Music">
    <meta property="og:description" content="Descubre nuevos artistas independientes.">

    <style>
        body {
            display: block;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        }

        .hero-section {
            padding: 150px 20px 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-family: 'Oswald', sans-serif;
            font-size: 12vw;
            color: var(--pink);
            text-transform: uppercase;
            line-height: 0.8;
            letter-spacing: -5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-shadow: 5px 5px 0px rgba(231, 114, 167, 0.2);
        }

        .main-title i {
            font-size: 0.6em;
            vertical-align: middle;
        }

        .search-wrapper {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 3px solid var(--pink);
            padding: 15px 50px 15px 20px;
            font-size: 1.5rem;
            color: white;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-bottom: 3px solid white;
            box-shadow: 0 10px 20px -10px var(--pink);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pink);
            font-size: 1.2rem;
        }

        .descubre-grid {
            padding: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .artist-card {
            aspect-ratio: 1/1;
            position: relative;
            overflow: hidden;
            border: 1px solid #222;
            background-color: var(--gray);
        }

        .card-img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), filter 0.5s ease;
        }

        .artist-card:hover .card-img {
            transform: scale(1.1);
            filter: grayscale(0%) contrast(1);
        }

        /* Solo la imagen es clicable, y solo si el artista tiene
           entrevista. El cursor va aqui (y no en .artist-card) para
           que la manita aparezca exactamente en la zona que
           responde al click. .card-info queda encima de la imagen
           en la parte de abajo y no abre el modal. */
        .card-img.is-clickable {
            cursor: pointer;
        }

        .card-img.is-clickable:focus-visible {
            outline: 3px solid var(--pink);
            outline-offset: -3px;
        }

        /* ===================== MODAL ENTREVISTA ===================== */
        .artist-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.88);
        }

        .artist-modal-overlay[hidden] {
            display: none;
        }

        .artist-modal {
            position: relative;
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            overflow-y: auto;
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left: 4px solid var(--pink);
            padding: 40px 36px 36px;
        }

        .artist-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .artist-modal-close:hover {
            border-color: var(--pink);
            color: var(--pink);
        }

        .artist-modal-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 24px;
            padding-right: 40px;
        }

        .artist-modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .artist-modal-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e8e8e8;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        @media (max-width: 768px) {
            .artist-modal { padding: 32px 22px 26px; }
            .artist-modal-name { font-size: 1.5rem; }
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: white;
            transform: translateY(10px);
            transition: var(--transition);
        }

        .artist-card:hover .card-info {
            transform: translateY(0);
        }

        .artist-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 10px;
            /* Los nombres ahora vienen del panel como texto libre,
               sin <br> fijos. Evita que una palabra larga desborde
               la tarjeta. */
            overflow-wrap: break-word;
        }

        .tags-row {
            display: flex; gap: 8px; flex-wrap: wrap;
        }

        .tag {
            border: 1px solid white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .artist-card:hover .tag {
            border-color: var(--pink);
            color: var(--pink);
        }

        .float-btn {
            position: absolute;
            top: 20px; right: 20px;
            width: 45px; height: 45px;
            border: 2px solid white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: white;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            transition: var(--transition);
        }

        .artist-card:hover .float-btn {
            background: var(--pink);
            border-color: var(--pink);
            transform: rotate(90deg);
        }

        .artists-empty {
            text-align: center;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 60px 20px 100px;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .main-title { font-size: 20vw; letter-spacing: -2px; }
            .descubre-grid { padding: 20px; }
        }

        .site-footer {
            background: #000;
            color: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .site-footer a {
            color: #fff;
            text-decoration: none;
        }

        .site-footer a:hover {
            color: var(--pink);
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            font-size: 14px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--pink);
        }
    </style>
</head>
<body>

    <main class="main-content">
        
        <section class="hero-section">
            <h1 class="main-title">
                <span>DESCUBRE</span> <i class="fa-solid fa-headphones"></i>

            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="BUSCAR ARTISTA, GÉNERO O CIUDAD...">

        <p class="artists-empty" id="artistsEmpty" style="display:none;">

        </p>

        <!-- Modal de entrevista: se abre al hacer click en la imagen
             de un artista que tenga texto de entrevista. -->
        <div class="artist-modal-overlay" id="artistModal" hidden>
            <div class="artist-modal" role="dialog" aria-modal="true" aria-labelledby="artistModalName">
                <button class="artist-modal-close" id="artistModalClose" type="button" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h2 class="artist-modal-name" id="artistModalName"></h2>

<script>
    /* ============================================
       DESCUBRE — render de artistas + buscador
       ============================================ */
    (function() {
        var grid = document.getElementById('artistsGrid');
        var emptyMsg = document.getElementById('artistsEmpty');
        var searchInput = document.querySelector('.hero-section .search-input');
        var allArtists = [];

        var modal = document.getElementById('artistModal');
        var modalName = document.getElementById('artistModalName');
        var modalTags = document.getElementById('artistModalTags');
        var modalText = document.getElementById('artistModalText');
        var modalClose = document.getElementById('artistModalClose');
        var lastFocused = null;

        function openInterview(artist) {
            if (!modal) return;
            lastFocused = document.activeElement;

            modalName.textContent = artist.name || '';

            modalTags.textContent = '';
            var tags = artist.tags || [];
            tags.forEach(function(tag) {
                var span = document.createElement('span');
                span.className = 'tag';
                span.textContent = tag;
                modalTags.appendChild(span);
            });
            modalTags.style.display = tags.length ? '' : 'none';

            /* white-space: pre-wrap respeta los saltos de linea que
               el panel guardo, asi los parrafos se ven como se
               escribieron. */
            modalText.textContent = artist.interview || '';

            modal.hidden = false;
            document.body.style.overflow = 'hidden';
            if (modalClose) modalClose.focus();
        }

        function closeInterview() {
            if (!modal || modal.hidden) return;
            modal.hidden = true;
            document.body.style.overflow = '';
            if (lastFocused && typeof lastFocused.focus === 'function') {
                lastFocused.focus();
            }
            lastFocused = null;
        }

        if (modalClose) modalClose.addEventListener('click', closeInterview);
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeInterview();
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeInterview();
        });

        function safeImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            var trimmed = url.trim();
            if (!trimmed) return '';
            var lower = trimmed.toLowerCase();
            if (lower.indexOf('javascript:') === 0) return '';
            if (lower.indexOf('data:text/html') === 0) return '';
            return trimmed;
        }

        function buildCard(artist) {
            var card = document.createElement('div');
            card.className = 'artist-card';

            var link = String(artist.link || '').trim();

            var img = document.createElement('img');
            img.src = safeImageUrl(artist.image);
            img.className = 'card-img';
            img.alt = artist.name || '';
            img.loading = 'lazy';

            /* Solo es boton si hay entrevista que mostrar. */
            var interview = String(artist.interview || '').trim();
            if (interview) {
                img.classList.add('is-clickable');
                img.setAttribute('role', 'button');
                img.setAttribute('tabindex', '0');
                img.setAttribute('aria-label', 'Leer la entrevista de ' + (artist.name || 'este artista'));
                img.addEventListener('click', function() { openInterview(artist); });
                img.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        openInterview(artist);
                    }
                });
            }
            card.appendChild(img);

            /* El "+" solo se dibuja si el artista tiene link. Como
               boton, si no tiene destino no es nada, y se veía igual
               que los de verdad. */
            if (link) {
                var floatBtn = document.createElement('a');
                floatBtn.className = 'float-btn';
                floatBtn.href = link;
                floatBtn.title = artist.name || '';
                floatBtn.setAttribute('aria-label', 'Ver ' + (artist.name || 'artista'));
                floatBtn.textContent = '+';
                if (/^https?:\/\//i.test(link)) {
                    floatBtn.target = '_blank';
                    floatBtn.rel = 'noopener noreferrer';
                }
                card.appendChild(floatBtn);
            }

            var info = document.createElement('div');
            info.className = 'card-info';

            var name = document.createElement('h2');
            name.className = 'artist-name';
            name.textContent = artist.name || '';
            info.appendChild(name);

            var tags = artist.tags || [];
            if (tags.length) {
                var tagsRow = document.createElement('div');
                tagsRow.className = 'tags-row';
                tags.forEach(function(tag) {
                    var span = document.createElement('span');
                    span.className = 'tag';
                    span.textContent = tag;
                    tagsRow.appendChild(span);
                });
                info.appendChild(tagsRow);
            }

            card.appendChild(info);
            return card;
        }

        function render(list) {
            grid.textContent = '';

            if (!list.length) {
                if (emptyMsg) emptyMsg.style.display = 'block';
                return;
            }
            if (emptyMsg) emptyMsg.style.display = 'none';

            list.forEach(function(artist) {
                grid.appendChild(buildCard(artist));
            });
        }

        function applyFilter() {
            var query = searchInput ? searchInput.value : '';
            render(window.WhiteBoxArtists.filter(allArtists, query));
        }

        function init() {
            window.WhiteBoxArtists.loadPublished().then(function(artists) {
                allArtists = artists || [];
                applyFilter();
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', applyFilter);
        }

        init();
    })();
</script>

<script src="js/site-config.js"></script>
</body>
