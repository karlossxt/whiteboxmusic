<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVO FOTOGRÁFICO | WhiteBox Music</title>
    <meta name="description" content="Archivo fotográfico de WhiteBox Music. Momentos en vivo, backstage y sesiones editoriales.">
    <meta property="og:title" content="ARCHIVO FOTOGRÁFICO | WhiteBox Music">
    <meta property="og:description" content="Archivo fotográfico de WhiteBox Music.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .gallery-hero {
            padding: 180px 50px 100px;
            text-align: center;
        }

        .main-title {
            font-family: 'Oswald', sans-serif;
            font-size: 10vw;
            color: white;
            text-transform: uppercase;
            line-height: 0.8;
            -webkit-text-stroke: 1px var(--pink);
            color: transparent;
        }

        .year-section {
            max-width: 1200px;
            margin: 0 auto 150px;
            padding: 0 20px;
        }

        .year-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            position: sticky;
            top: 100px;
            z-index: 10;
            background: var(--black);
            padding: 20px 0;
        }

        .year-number {
            font-family: 'Oswald', sans-serif;
            font-size: 6rem;
            color: var(--pink);
            line-height: 1;
        }

        .year-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, var(--pink), transparent);
        }

        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: var(--gray);
            cursor: pointer;
        }

        .photo-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            transition: var(--transition);
        }

        .photo-item:hover img {
            filter: grayscale(0%) contrast(1);
            transform: scale(1.1);
        }

        .photo-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: var(--transition);
            border: 2px solid var(--pink);
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .photo-overlay i {
            color: var(--pink);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .photo-info {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .instagram-grid { grid-template-columns: repeat(2, 1fr); }
            .year-number { font-size: 4rem; }
            .main-title { font-size: 15vw; }
        }

        .site-footer {
            background: #000;
            color: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .site-footer a {
            color: #fff;
            text-decoration: none;
        }

        .site-footer a:hover {
            color: var(--pink);
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            font-size: 14px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--pink);
        }
    </style>
</head>
<body class="no-sidebar">

    <header>
        <nav class="nav-links">
            <a href="index.html">HOME</a>
            <a href="descubre.html">DESCUBRE</a>
            <a href="entreE.html">ENTREVISTAS</a>
            <a href="comunidad.html">COMUNIDAD</a>
            <a href="contacto.html">CONTACTO</a>
        </nav>
    </header>

    <main>
        
        <section class="gallery-hero">
            <h1 class="main-title">EL ARCHIVO</h1>
        </section>

        <div id="galleryContainer"></div>

    </main>

    <footer class="site-footer">
        <a href="terminos.html">T&eacute;rminos y condiciones</a>
        <div class="social-icons">
            <a href="#" title="Spotify"><i class="fa-brands fa-spotify"></i></a>
            <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </footer>

    <script>
        var ICONS = ['fa-bolt','fa-microphone','fa-heart','fa-location-dot','fa-music','fa-camera','fa-star','fa-compact-disc','fa-users','fa-guitar','fa-headphones','fa-wand-magic-sparkles'];

        var DEFAULTS = [
            {
                year: '2026', subtitle: 'FUTURE SESSIONS',
                photos: [
                    { img: 'https://images.pexels.com/photos/1763075/pexels-photo-1763075.jpeg', label: 'ESTADIO NACIONAL / TOUR' },
                    { img: 'https://images.pexels.com/photos/1105666/pexels-photo-1105666.jpeg', label: 'GRABACIÓN ALBUM III' },
                    { img: 'https://images.pexels.com/photos/144428/pexels-photo-144428.jpeg', label: 'BACKSTAGE MOMENTS' }
                ]
            },
            {
                year: '2025', subtitle: 'EXPANSIÓN',
                photos: [
                    { img: 'https://images.pexels.com/photos/164745/pexels-photo-164745.jpeg', label: 'SALA NEÓN / MADRID' },
                    { img: 'https://images.pexels.com/photos/257904/pexels-photo-257904.jpeg', label: 'FESTIVAL INDIE ROCK' },
                    { img: 'https://images.pexels.com/photos/167491/pexels-photo-167491.jpeg', label: 'SESIÓN EDITORIAL' }
                ]
            },
            {
                year: '2024', subtitle: 'EL ORIGEN',
                photos: [
                    { img: 'https://images.pexels.com/photos/1047442/pexels-photo-1047442.jpeg', label: 'PRIMER SHOW EN VIVO' },
                    { img: 'https://images.pexels.com/photos/164853/pexels-photo-164853.jpeg', label: 'LANZAMIENTO WHITEBOX I' },
                    { img: 'https://images.pexels.com/photos/210922/pexels-photo-210922.jpeg', label: 'EL EQUIPO FUNDADOR' }
                ]
            }
        ];

        function loadGallery() {
            var container = document.getElementById('galleryContainer');
            if (!container) return;

            var raw;
            try {
                raw = localStorage.getItem('backstage_gallery_events_data');
            } catch(e) {}

            var events;
            if (raw) {
                try {
                    events = JSON.parse(raw);
                } catch(e) {}
            }

            if (!events || !events.length) {
                events = DEFAULTS.map(function(d) {
                    return {
                        title: d.year,
                        subtitle: d.subtitle,
                        galleryItems: d.photos.map(function(p) {
                            return { image: p.img, title: p.label, text: '' };
                        })
                    };
                });
            }

            container.textContent = '';

            events.forEach(function(ev, idx) {
                var items = ev.galleryItems || [];
                if (!items.length) return;

                var section = document.createElement('section');
                section.className = 'year-section';

                var header = document.createElement('div');
                header.className = 'year-header';

                var yearSpan = document.createElement('span');
                yearSpan.className = 'year-number';
                yearSpan.textContent = ev.title || 'AÑO';

                var line = document.createElement('div');
                line.className = 'year-line';

                var label = document.createElement('p');
                label.style.cssText = 'font-size:0.7rem;letter-spacing:3px;';
                label.textContent = (ev.subtitle || '').toUpperCase();

                header.appendChild(yearSpan);
                header.appendChild(line);
                header.appendChild(label);
                section.appendChild(header);

                var grid = document.createElement('div');
                grid.className = 'instagram-grid';

                items.forEach(function(item, i) {
                    var div = document.createElement('div');
                    div.className = 'photo-item';

                    var img = document.createElement('img');
                    img.src = item.image || '';
                    img.alt = item.title || 'Foto';
                    img.loading = 'lazy';

                    var overlay = document.createElement('div');
                    overlay.className = 'photo-overlay';

                    var icon = document.createElement('i');
                    icon.className = 'fa-solid ' + (ICONS[(idx * items.length + i) % ICONS.length]);

                    var info = document.createElement('span');
                    info.className = 'photo-info';
                    info.textContent = item.title || '';

                    overlay.appendChild(icon);
                    overlay.appendChild(info);
                    div.appendChild(img);
                    div.appendChild(overlay);
                    grid.appendChild(div);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>

</body>
</html>
