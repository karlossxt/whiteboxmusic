<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | Backstage Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #151517;
      border: 1px solid #2b2b30;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 28px;
      color: #a7a7ad;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #36363d;
      border-radius: 9px;
      background: #19191c;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #e64a8a;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1478f2;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #43171c;
      border: 1px solid #77252e;
      color: #ffb3bc;
    }

    .message.success {
      display: block;
      background: #173a27;
      border: 1px solid #245c3c;
      color: #b8f5cf;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Nueva contraseña</h1>
    <p>Escribe la contraseña que utilizarás para acceder a Backstage Studio.</p>

    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        Guardar nueva contraseña
      </button>

      <div id="message" class="message"></div>
    </form>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>

  <script>
    (async function () {

      const form = document.getElementById('resetForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const message = document.getElementById('message');
      const submitButton = document.getElementById('submitButton');

      function showMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + type;
      }

      function getClient() {
        return new Promise(function(resolve, reject) {

          let attempts = 0;

          const timer = setInterval(function() {

            attempts++;

            if (
              typeof window.getSupabaseClient === 'function' &&
              window.getSupabaseClient()
            ) {
              clearInterval(timer);
              resolve(window.getSupabaseClient());
              return;
            }

            if (attempts > 50) {
              clearInterval(timer);
              reject(new Error('No se pudo iniciar Supabase.'));
            }

          }, 100);

        });
      }

      let supabaseClient;

      try {

        supabaseClient = await getClient();

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
          showMessage(
            'El enlace de recuperación no es válido o ya expiró. Solicita uno nuevo.',
            'error'
          );
          submitButton.disabled = true;
          return;
        }

      } catch (error) {

        console.error(error);

        showMessage(
          'No fue posible validar la sesión de recuperación.',
          'error'
        );

        submitButton.disabled = true;
        return;
      }


      form.addEventListener('submit', async function(event) {

        event.preventDefault();

        message.className = 'message';

        const newPassword = password.value;
        const confirmation = confirmPassword.value;

        if (newPassword.length < 8) {
          showMessage(
            'La contraseña debe contener al menos 8 caracteres.',
            'error'
          );
          return;
        }

        if (newPassword !== confirmation) {
          showMessage(
            'Las contraseñas no coinciden.',
            'error'
          );
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Guardando...';

        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {

          console.error(error);

          showMessage(
            'No fue posible cambiar la contraseña: ' + error.message,
            'error'
          );

          submitButton.disabled = false;
          submitButton.textContent = 'Guardar nueva contraseña';
          return;
        }

        showMessage(
          'Contraseña actualizada correctamente. Redirigiendo al panel...',
          'success'
        );

        setTimeout(function() {
          window.location.href = 'index.html';
        }, 1500);

      });

    })();
  </script>

</body>
</html>
