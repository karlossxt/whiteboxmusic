<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage Studio — WhiteBox Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/backstage.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="../index.html"><img src="../logo.png" alt="WhiteBox Music"></a>
                <span class="admin-badge">STUDIO</span>
            </div>
            <nav class="admin-nav">
                <a href="#dashboard" class="admin-nav-item active" data-section="dashboard">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#stories" class="admin-nav-item" data-section="stories">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Historias</span>
                </a>
                <a href="#soundscapes" class="admin-nav-item" data-section="soundscapes">
                    <i class="fa-solid fa-headphones"></i>
                    <span>Latest Soundscapes</span>
                </a>
                <div class="admin-nav-divider"></div>
                <a href="../index.html" class="admin-nav-item" target="_blank">
                    <i class="fa-solid fa-external-link"></i>
                    <span>Ver sitio</span>
                </a>
            </nav>
            <div class="admin-sidebar-footer">
                Backstage Studio
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <h1>Dashboard</h1>
                    <p class="admin-subtitle">Vista general del sitio</p>
                </div>
                <div class="admin-header-right"></div>
            </header>

            <section class="admin-section" id="section-dashboard"></section>
            <section class="admin-section" id="section-stories" style="display:none;"></section>
            <section class="admin-section" id="section-soundscapes" style="display:none;"></section>
        </main>
    </div>

    <!-- Story Form Modal -->
    <div class="modal-overlay" id="storyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nueva Historia</h2>
                <button class="modal-close" id="modalClose" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="storyForm" novalidate>
                <input type="hidden" id="formId">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="formTitle">Titulo <span class="required">*</span></label>
                        <input type="text" id="formTitle" required placeholder="Titulo de la historia">
                    </div>
                    <div class="form-group">
                        <label for="formAuthor">Autor <span class="required">*</span></label>
                        <input type="text" id="formAuthor" required placeholder="Nombre o alias">
                    </div>
                    <div class="form-group">
                        <label for="formLocation">Ubicacion</label>
                        <input type="text" id="formLocation" placeholder="Ciudad, Pais">
                    </div>
                    <div class="form-group">
                        <label for="formImage">URL de imagen</label>
                        <input type="url" id="formImage" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="formDate">Fecha</label>
                        <input type="text" id="formDate" placeholder="Ej: Octubre 2023">
                    </div>
                    <div class="form-group">
                        <label for="formRelatedSong">Cancion relacionada</label>
                        <input type="text" id="formRelatedSong" placeholder="Artista - Cancion">
                    </div>
                    <div class="form-group">
                        <label for="formInitialLikes">Likes iniciales</label>
                        <input type="number" id="formInitialLikes" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="formOrder">Orden</label>
                        <input type="number" id="formOrder" min="1" value="1">
                    </div>
                    <div class="form-group full-width">
                        <label for="formExcerpt">Extracto <span class="required">*</span></label>
                        <textarea id="formExcerpt" rows="2" required placeholder="Resumen corto (maximo 3 lineas)"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="formContent">Historia completa <span class="required">*</span></label>
                        <textarea id="formContent" rows="8" required placeholder="Contenido completo. Separa parrafos con doble salto de linea."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="formStatus">Estado</label>
                        <select id="formStatus">
                            <option value="published">Publicada</option>
                            <option value="draft">Borrador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="formFeatured">Destacada</label>
                        <select id="formFeatured">
                            <option value="false">No</option>
                            <option value="true">Si</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnCancel">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btnSave">
                        <i class="fa-solid fa-check"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Soundscape Form Modal -->
    <div class="modal-overlay" id="soundscapeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="ssModalTitle">Nueva Cancion</h2>
                <button class="modal-close" id="ssModalClose" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="soundscapeForm" novalidate>
                <input type="hidden" id="ssFormId">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="ssFormTitle">Titulo <span class="required">*</span></label>
                        <input type="text" id="ssFormTitle" required placeholder="Titulo de la cancion">
                    </div>
                    <div class="form-group">
                        <label for="ssFormArtist">Artista <span class="required">*</span></label>
                        <input type="text" id="ssFormArtist" required placeholder="Nombre del artista">
                    </div>
                    <div class="form-group">
                        <label for="ssFormPlaylist">Playlist</label>
                        <input type="text" id="ssFormPlaylist" placeholder="Ej: World Tour, Sound On">
                    </div>
                    <div class="form-group">
                        <label for="ssFormCover">URL de portada</label>
                        <input type="url" id="ssFormCover" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="ssFormSpotifyUrl">URL de Spotify</label>
                        <input type="url" id="ssFormSpotifyUrl" placeholder="https://open.spotify.com/track/...">
                    </div>
                    <div class="form-group">
                        <label for="ssFormDuration">Duracion (segundos)</label>
                        <input type="number" id="ssFormDuration" min="1" value="180">
                    </div>
                    <div class="form-group">
                        <label for="ssFormOrder">Orden</label>
                        <input type="number" id="ssFormOrder" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="ssFormPublished">Estado</label>
                        <select id="ssFormPublished">
                            <option value="true">Publicada</option>
                            <option value="false">Borrador</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="ssBtnCancel">Cancelar</button>
                    <button type="submit" class="btn-primary" id="ssBtnSave">
                        <i class="fa-solid fa-check"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content modal-confirm">
            <div class="confirm-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle">Confirmar</h3>
            <p id="confirmText">Esta accion no se puede deshacer.</p>
            <div class="confirm-actions">
                <button class="btn-secondary" id="confirmCancel">Cancelar</button>
                <button class="btn-danger" id="confirmDelete">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Legacy data (read-only, used for first-run migration) -->
    <script src="../js/stories-data.js"></script>
    <script src="../js/soundscapes-data.js"></script>

    <!-- Core -->
    <script src="core/event-bus.js"></script>
    <script src="core/router.js"></script>

    <!-- Models -->
    <script src="models/story.js"></script>
    <script src="models/soundscape.js"></script>

    <!-- Datasources -->
    <script src="datasources/local/local-datasource.js"></script>
    <script src="datasources/datasource-registry.js"></script>

    <!-- Repositories -->
    <script src="repositories/base-repository.js"></script>
    <script src="repositories/story-repository.js"></script>
    <script src="repositories/soundscape-repository.js"></script>

    <!-- Services -->
    <script src="services/story-service.js"></script>
    <script src="services/soundscape-service.js"></script>
    <script src="services/dashboard-service.js"></script>

    <!-- Templates -->
    <script src="templates/stats-cards.js"></script>
    <script src="templates/data-table.js"></script>
    <script src="templates/story-form.js"></script>
    <script src="templates/soundscape-form.js"></script>
    <script src="templates/empty-state.js"></script>
    <script src="templates/action-buttons.js"></script>

    <!-- Components -->
    <script src="components/sidebar.js"></script>
    <script src="components/header.js"></script>
    <script src="components/modal.js"></script>
    <script src="components/toast.js"></script>
    <script src="components/confirm.js"></script>

    <!-- Views -->
    <script src="views/dashboard-view.js"></script>
    <script src="views/story-view.js"></script>
    <script src="views/soundscape-view.js"></script>

    <!-- Controllers -->
    <script src="controllers/dashboard-controller.js"></script>
    <script src="controllers/story-controller.js"></script>
    <script src="controllers/soundscape-controller.js"></script>

    <!-- App Bootstrap -->
    <script src="app.js"></script>
</body>
</html>
